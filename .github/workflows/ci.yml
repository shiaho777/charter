name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis
        run: ./gradlew detekt

      - name: Architecture tests
        run: ./gradlew :architecture-tests:test

      - name: Agent contract verification
        run: ./gradlew verifyAgentContract

  test:
    name: Tests & screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Screenshot regression
        run: ./gradlew :catalog:verifyRoborazziDebug

      - name: Design audit
        run: ./gradlew :catalog:designAudit

      - name: Build
        run: ./gradlew assembleDebug

      - name: Upload verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: |
            **/build/reports/agent-contract/
            **/build/reports/design-review/
            catalog/build/outputs/design-review/
          retention-days: 14

  verify-ui:
    name: Acceptance harness
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: verifyUi
        run: ./gradlew verifyUi
