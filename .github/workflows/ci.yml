name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Formatting
        run: ./gradlew spotlessCheck

      - name: Static analysis
        run: ./gradlew detekt

      - name: Architecture tests
        run: ./gradlew :architecture-tests:test

      - name: Agent contract verification
        run: ./gradlew verifyAgentContract

  # Screenshot goldens live in catalog/src/test/screenshots and were recorded
  # on macOS arm64 (the development platform). Robolectric NATIVE graphics
  # rendering is not pixel-identical across OS/CPU, so the jobs that verify
  # goldens must run on the recording platform — anything else fails on
  # cross-platform raster drift, not on real regressions (#3).
  test:
    name: Tests & screenshots
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Screenshot regression
        run: ./gradlew :catalog:verifyRoborazziDebug

      - name: Design audit
        run: ./gradlew :catalog:designAudit

      - name: Build
        run: ./gradlew assembleDebug

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-evidence
          path: |
            **/build/reports/agent-contract/
            **/build/reports/design-review/
            catalog/build/outputs/design-review/
            catalog/src/test/screenshots/
          retention-days: 14

  verify-ui:
    name: Acceptance harness
    runs-on: macos-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: verifyUi
        run: ./gradlew verifyUi
